name: EAS Build (local APK)

# Запуск вручную: Actions → EAS Build (local APK) → Run workflow.
#
# Собирает Android APK ЛОКАЛЬНО на раннере GitHub через `eas build --local`.
# Преимущества перед облачной сборкой:
#   • полный лог Gradle виден прямо в этом workflow (удобно для диагностики);
#   • готовый APK публикуется как артефакт — скачивается прямо из GitHub,
#     без захода на expo.dev.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Профиль из eas.json'
        type: choice
        default: preview
        options:
          - preview
          - development
          - production

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java (JDK 17 для React Native 0.74)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # --local: сборка идёт на этом раннере; весь вывод Gradle попадает в лог.
      # GOOGLE_MAPS_API_KEY (из секрета репозитория) подставляется в
      # app.config.js на этапе prebuild, чтобы карта работала в APK.
      - name: Build APK (local)
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile }} \
            --local \
            --non-interactive \
            --output "${{ github.workspace }}/mustaxi.apk"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mustaxi-${{ github.event.inputs.profile }}-apk
          path: mustaxi.apk
          if-no-files-found: error
