name: EAS Build

# Запуск вручную из вкладки Actions на GitHub («Run workflow»).
# Собирает приложение в облаке Expo (EAS). Полный лог сборки (включая Gradle)
# стримится прямо сюда, в лог Actions; ссылка на готовый APK/сборку также
# появится в конце и на https://expo.dev в вашем проекте.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Платформа сборки'
        type: choice
        default: android
        options:
          - android
          - ios
          - all
      profile:
        description: 'Профиль из eas.json'
        type: choice
        default: preview
        options:
          - preview
          - development
          - production

jobs:
  build:
    name: Build with EAS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Link EAS project
        run: eas init --non-interactive --force

      # Без --no-wait: дожидаемся сборки, чтобы полный лог (в т.ч. Gradle)
      # был виден прямо в этом шаге, а статус Actions отражал результат.
      - name: Build
        run: |
          eas build \
            --platform ${{ github.event.inputs.platform }} \
            --profile ${{ github.event.inputs.profile }} \
            --non-interactive
